version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      playwright:
        patterns: [playwright, playwright-core, '@axe-core/playwright']
      tauri-javascript:
        patterns: ['@tauri-apps/*']
      vite-toolchain:
        patterns: [vite, '@vitejs/plugin-react', esbuild, typescript]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: daily
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
