[package]
name = "testrill"
version = "0.1.0"
description = "A local testing workbench for people and agents"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
serde_json = "1.0.154"

[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.release]
strip = false
lto = true
codegen-units = 1

# Avoid Mach-O proc-macro dylib corruption in affected LLVM strip versions.
[profile.release.build-override]
strip = false
