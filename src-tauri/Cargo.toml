[package]
name = "testrill"
version = "0.1.0"
description = "A local testing workbench for people and agents"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
strip = false
lto = true
codegen-units = 1

# Avoid Mach-O proc-macro dylib corruption in affected LLVM strip versions.
[profile.release.build-override]
strip = false
